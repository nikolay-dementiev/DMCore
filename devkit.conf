# The settings of this repository for DMDevKit, schema version 1. Tools/Package.swift pins the
# DMDevKit that reads them. This file is shell code that runs with the rights of whoever runs a
# script, so review a change to it like any other code.
#
# Every setting of this repository is written here once. The commands read these names:
# check-lint-contract SOURCE_DIR, RULES and FIXTURE_DIR; check-api MODULE, SOURCE_DIR, SWIFT_FLAGS,
# LIBRARY_EVOLUTION, DEPENDENCIES and PREPARE; check-wrappers WRAPPERS, the scripts of Scripts/
# that forward to devkit, each one named by its file. SWIFT_FLAGS repeats what Package.swift sets
# for the library, so change both.
DEVKIT_CONF_VERSION=1
MODULE="DMCore"
SOURCE_DIR="Sources/DMCore"
RULES="domain_no_imports force_cast force_try force_unwrapping library_imports no_process_termination no_reexport"
FIXTURE_DIR="Fixtures/Lint"
SWIFT_FLAGS=(-swift-version 6 -enable-upcoming-feature ExistentialAny)
LIBRARY_EVOLUTION="yes"
DEPENDENCIES=()
PREPARE=()
WRAPPERS=(lint.sh check-lint-contract.sh check-lint-tool.sh check-wrappers.sh)
