swiftlint_version: 0.65.1

included:
  - Sources
  - Tests
  - Fixtures

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - missing_docs

# Analyzer rules need the compiler invocations of a build. They run only with
# `Scripts/lint.sh --analyze <xcodebuild log>`, on the log of a build whose DerivedData is
# still on disk: the compiler invocations name their files through lists kept there.
analyzer_rules:
  - unused_import

# By default the rule lets a few calls with a literal argument be force unwrapped, such as
# URL(string: "https://example.com")!. ENGINEERING.md states no exception, so the list is empty.
force_unwrapping:
  ignored_literal_argument_functions: []

identifier_name:
  min_length: 2
  allowed_symbols: [_]

file_length:
  warning: 600
  error: 1000

type_body_length:
  warning: 500
  error: 1000

function_parameter_count:
  warning: 6
  error: 10

line_length:
  warning: 130
  error: 200

# Every public symbol is documented. By default the rule skips the members of a type that
# conforms to a protocol or inherits from a class, so it is told to check them too.
missing_docs:
  excludes_inherited_types: false

custom_rules:
  no_process_termination:
    name: "No process termination"
    # The two library modules, by name: a path that merely holds a Sources folder, such as a
    # fixture package or another module, is not the library.
    included: ".*/Sources/(DMCore|DMCoreTesting)/.*\\.swift"
    # A call of a function that traps, exits or signals, and the isolation checks that trap, which
    # may take a trailing closure and no parenthesis. A name used without a call, such as exit
    # passed as a value, and a name in backticks are not seen.
    regex: '\b(?:(?:fatalError|preconditionFailure|assertionFailure|precondition|assert|dispatchPrecondition|abort|exit|_exit|_Exit|raise|kill|pthread_kill)\s*\(|(?:preconditionIsolated|assertIsolated|assumeIsolated)\b)'
    match_kinds:
      - identifier
    message: "A library never terminates its host. Report the failure to the caller."
    severity: error
  library_imports:
    name: "Library imports"
    # The two library folders only. The pattern is matched against the absolute path, so a checkout
    # inside a folder that is itself named Sources/DMCore would apply it to everything.
    included: ".*/Sources/(DMCore|DMCoreTesting)/.*\\.swift"
    # Every import keyword that is not followed, on its own line, by os or DMCore, with or without
    # an import kind before the name; a submodule of os is allowed. So a comment or backticks between
    # the keyword and the name are reported, and so is a permitted module written on the next line.
    # Comments and strings never match.
    regex: '\bimport\b(?![ \t]+(?:(?:struct|class|enum|protocol|typealias|func|var|let)[ \t]+)?(?:os|DMCore)\b)'
    match_kinds: [keyword]
    message: "The library imports os only, and DMCoreTesting also DMCore: no Foundation, no UI and no third party."
    severity: error
  domain_no_imports:
    name: "Domain imports nothing"
    included: ".*/Sources/DMCore/Domain/.*\\.swift"
    regex: '\bimport\b'
    match_kinds: [keyword]
    message: "The Domain folder imports no module: system frameworks belong to the Adapters folder."
    severity: error
  no_reexport:
    name: "No re-exported import"
    included: ".*/Sources/(DMCore|DMCoreTesting)/.*\\.swift"
    regex: '@_exported\b'
    match_kinds: [attribute.builtin]
    message: "No import is re-exported: it would reach every file of the module, Domain included, and every consumer."
    severity: error
