swiftlint_version: 0.65.1

included:
  - Sources
  - Tests
  - Fixtures

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - missing_docs

# By default the rule lets a few calls with a literal argument be force unwrapped, such as
# URL(string: "https://example.com")!. ENGINEERING.md states no exception, so the list is empty.
force_unwrapping:
  ignored_literal_argument_functions: []

identifier_name:
  min_length: 2
  allowed_symbols: [_]

file_length:
  warning: 600
  error: 1000

type_body_length:
  warning: 500
  error: 1000

function_parameter_count:
  warning: 6
  error: 10

line_length:
  warning: 130
  error: 200

# Every public symbol is documented. By default the rule skips the members of a type that
# conforms to a protocol or inherits from a class, so it is told to check them too.
missing_docs:
  excludes_inherited_types: false

custom_rules:
  no_process_termination:
    name: "No process termination"
    # The two library modules, by name: a path that merely holds a Sources folder, such as a
    # fixture package or another module, is not the library.
    included: ".*/Sources/(DMCore|DMCoreTesting)/.*\\.swift"
    regex: '\b(fatalError|preconditionFailure|assertionFailure|precondition|assert|dispatchPrecondition|abort|exit)\s*\('
    match_kinds:
      - identifier
    message: "A library never terminates its host. Report the failure to the caller."
    severity: error
  library_imports:
    name: "Library imports"
    # The two library folders only. The pattern is matched against the absolute path, so a checkout
    # inside a folder that is itself named Sources/DMCore would apply it to everything.
    included: ".*/Sources/(DMCore|DMCoreTesting)/.*\\.swift"
    # Any attribute, access level and import kind; a second import after a semicolon; a submodule
    # of os is allowed. Comments and strings never match. Only spaces and tabs may come before the
    # import, so that a blank line is not swallowed and the diagnostic lands on the line of the
    # import. An import that follows a block comment on the same line is not seen.
    regex: '(?:^|;)[ \t]*(@\w+(\([^)]*\))?\s+)*((public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:struct|class|enum|protocol|typealias|func|var|let)\s+)?+(?!(?:os|DMCore)\b)\w+'
    match_kinds: [keyword, identifier, attribute.builtin, attribute.id]
    message: "The library imports os only, and DMCoreTesting also DMCore: no Foundation, no UI and no third party."
    severity: error
  domain_no_imports:
    name: "Domain imports nothing"
    included: ".*/Sources/DMCore/Domain/.*\\.swift"
    regex: '(?:^|;)[ \t]*(@\w+(\([^)]*\))?\s+)*((public|package|internal|fileprivate|private)\s+)?import\s+\w+'
    match_kinds: [keyword, identifier, attribute.builtin, attribute.id]
    message: "The Domain folder imports no module: system frameworks belong to the Adapters folder."
    severity: error
